# 夜間の差分テスト大規模版（D-016）。乱数シードで回し、不一致は最小化して成果物に残す。
name: nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      cases:
        description: "number of cases (shanten/waits and hora each; majiang-core games = cases / 500)"
        default: "2000000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24.18.0"

jobs:
  difftest-large:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/difftest-majiang/node/package-lock.json

      - name: install majiang-core (pinned)
        working-directory: tools/difftest-majiang/node
        run: npm ci --no-audit --no-fund

      - name: difftest vs majiang-core (large, random seed)
        run: |
          cargo run --release --locked -p difftest-majiang -- \
            --cases "${{ github.event.inputs.cases || '2000000' }}" --random-seed \
            --out difftest-out
        # シードは summary.json に記録されるので、失敗したケースは同じシードで再現できる

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: install RiichiEnv in an isolated venv (D-010, pinned)
        run: |
          python -m venv .venv-riichienv
          .venv-riichienv/bin/python -m pip install --quiet -r tools/difftest-riichienv/harness/requirements.txt

      - name: difftest vs RiichiEnv (sanma, large, random seed)
        if: always()
        run: |
          cargo run --release --locked -p difftest-riichienv --             --cases "${{ github.event.inputs.cases || '2000000' }}" --game-cases 20000 --random-seed             --python .venv-riichienv/bin/python --out difftest-riichienv-out

      - name: summary
        if: always()
        run: |
          {
            echo "### nightly difftest (majiang-core)"
            echo '```json'
            cat difftest-out/summary.json || true
            echo '```'
            echo "minimized failures (first 20):"
            echo '```'
            head -n 20 difftest-out/failures.jsonl || true
            head -n 20 difftest-out/hora_failures.jsonl || true
            head -n 3 difftest-out/game_failures.jsonl | cut -c1-2000 || true
            echo '```'
            echo "### nightly difftest (RiichiEnv)"
            echo '```json'
            cat difftest-riichienv-out/summary.json || true
            echo '```'
            echo '```'
            head -n 5 difftest-riichienv-out/hand_failures.jsonl || true
            head -n 5 difftest-riichienv-out/hora_failures.jsonl | cut -c1-2000 || true
            head -n 5 difftest-riichienv-out/game_failures.jsonl | cut -c1-2000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload result and minimized failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-difftest-${{ github.run_id }}
          path: |
            difftest-out/
            difftest-riichienv-out/
          retention-days: 90
