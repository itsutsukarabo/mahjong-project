# テスト対応表：「ルール項目 × 値」ごとに、その分岐を確かめるテストを対応付ける（D-025）。
#
# - 項目と値はルールカタログ（docs/spec/RULES_CATALOG.md、正は crates/mj-core/src/catalog.rs）の全行。
#   真偽値は true / false、列挙は各値、数値は "*"（少なくとも1つ）
# - tests：`<package>::<テストのパス>`。その値を変えると結果が変わる局面で、値ごとの期待結果を確かめるテスト
# - pending：まだ実装していない分岐（tests とどちらか一方）。--strict では失敗になる
# - 検査：cargo run -p rules-catalog -- coverage（CI）。行が欠けている・テストが実在しない場合は失敗
# - 行を足す：cargo run -p rules-catalog -- add-missing（足りない行を pending で末尾に足す）

