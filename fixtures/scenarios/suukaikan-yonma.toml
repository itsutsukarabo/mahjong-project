[setup]
hands = [
    "E E E E S S S S 1p 2p 3p 4p 5p",
    "W W W W P P P P 1s 2s 3s 4s 9m",
    "1m 1m 9m 6p 9p 3s 7s F F C C N 2s",
    "2m 3m 5m 6m 8m 8m 4s 5s 1m 7m F C N",
]
draws = "6p 6s"
