# 雀魂三麻相当（段位戦 三人麻雀）— 次点のプリセット（D-011）
#
# 出典：雀魂公式 X アカウント @MahjongSoul_JP の投稿（項目ごとの URL は docs/spec/RULES_PRESETS.md）
# 雀魂のルール説明はゲーム内（段位戦「～の間」の「！」）にあり、公式サイトのウェブページからは
# 本文を取得できなかった（2026-11-22）。そのため確認できた項目はわずかで、残りは未確認。
#
# 公式説明で確認できない項目は書かない（meta.unconfirmed）。読み込むと RulesError::Missing になる。

