# 雀魂三麻相当（段位戦 三人麻雀）— 次点のプリセット（D-011）
#
# 出典：雀魂公式 X アカウント @MahjongSoul_JP の投稿（項目ごとの URL は docs/spec/RULES_PRESETS.md の M1〜M3）
# 雀魂のルール説明はゲーム内（段位戦「～の間」の「！」）にあり、公式サイトのウェブページからは
# 本文を取得できなかった（2026-11-22）。
#
# 全項目に値を書く（D-025）。公式で確認できた項目と本PJの値以外は「# 仮」で、天鳳三麻（rules/tenhou-sanma.toml）と
# 同じ値を仮に入れてある。雀魂のルールとして確認した値ではない（meta.provisional）。
# 確認は質問票 docs/spec/RULES_QUESTIONS_MJSOUL.md で行う。

[meta]
id = "mjsoul-sanma"
name = "雀魂三麻相当（段位戦 三人麻雀）"
provisional = [
    "table.length",
    "table.extension",
    "table.extension_threshold_counts_kyotaku",
    "table.extension_last_wind",
    "table.oorasu_stop",
    "table.tobi",
    "table.tie_break",
    "table.leftover_kyotaku",
    "points.starting",
    "points.returning",
    "points.uma",
    "points.honba_ron",
    "points.honba_tsumo_each",
    "points.noten_penalty_total",
    "points.riichi_deposit",
    "points.kiriage_mangan",
    "points.kazoe_yakuman",
    "points.min_han",
    "points.double_wind_pair_fu",
    "points.rinshan_tsumo_fu",
    "tiles.manzu",
    "tiles.red_fives.m",
    "tiles.red_fives.p",
    "tiles.red_fives.s",
    "wall.dora_indicator_slots",
    "wall.dead_wall",
    "wall.rinshan_max",
    "calls.chi",
    "calls.kuitan",
    "calls.atozuke",
    "calls.kuikae",
    "calls.haitei_call",
    "calls.max_ron",
    "calls.multi_ron_deposit",
    "riichi.min_points",
    "riichi.requires_draw",
    "riichi.furiten_riichi",
    "riichi.ankan_after_riichi",
    "riichi.no_deposit_on_deal_in",
    "dora.ippatsu",
    "dora.ura",
    "dora.kan_dora",
    "dora.kan_ura",
    "dora.kan_dora_timing",
    "kita.mandatory",
    "kita.after_pon",
    "kita.after_riichi",
    "kita.ron_on_discard",
    "kita.breaks_ippatsu",
    "kita.breaks_first_turn",
    "kita.north_as_meld",
    "kita.dora_per_kita",
    "draws.kyushu_kyuhai",
    "draws.suukaikan",
    "draws.all_riichi",
    "draws.same_wind_discards",
    "draws.all_ron",
    "draws.abortive_renchan",
    "draws.nagashi_mangan",
    "draws.renchan",
    "draws.keishiki_tenpai",
    "draws.noten_declaration",
    "yakuman.composite",
    "yakuman.double_special",
    "yakuman.pao",
    "yakuman.pao_ron_split",
    "yakuman.kokushi_ron_on_ankan",
    "chips.enabled",
    "chips.values.ippatsu",
    "chips.values.aka",
    "chips.values.ura",
    "chips.values.aka_when_open",
    "chips.values.yakuman_ron",
    "chips.values.yakuman_tsumo_each",
    "chips.values.kazoe_yakuman_counts",
    "chips.values.point_value",
]

[table]
num_players = 3                          # M1〜M3（三人麻雀）
length = "hanchan"                       # 仮
extension = "sudden_death"               # 仮
extension_threshold = 40000              # M3「1位が30000点(三人麻雀の場合は40000点)未満の場合南入(半荘戦の場合は西入)」
extension_threshold_counts_kyotaku = false # 仮
extension_last_wind = "west"             # 仮
oorasu_stop = "auto"                     # 仮
tobi = "below_zero"                      # 仮
tobi_single_kyoku = "none"               # 本PJ D-012
tie_break = "seat_order"                 # 仮
leftover_kyotaku = "top"                 # 仮

[points]
starting = 35000                         # 仮
returning = 40000                        # 仮
uma = [20000, 0, -20000]                 # 仮
tsumo_payment = "loss"                   # M1「三人麻雀段位戦ではツモ損が有効です」
honba_ron = 1000                         # 仮
honba_tsumo_each = 500                   # 仮
noten_penalty_total = 2000               # 仮
riichi_deposit = 1000                    # 仮
kiriage_mangan = false                   # 仮
kazoe_yakuman = true                     # 仮
min_han = 1                              # 仮
double_wind_pair_fu = 4                  # 仮
rinshan_tsumo_fu = true                  # 仮

[tiles]
manzu = "terminals_only"                 # 仮
red_fives = { m = 0, p = 1, s = 1 }      # 仮

[wall]
dora_indicator_slots = 5                 # 仮
dead_wall = 14                           # 仮
rinshan_max = 8                          # 仮

[calls]
chi = false                              # 仮
kuitan = true                            # 仮
atozuke = true                           # 仮
kuikae = "forbidden"                     # 仮
haitei_call = false                      # 仮
max_ron = 2                              # 仮
multi_ron_deposit = "upstream"           # 仮

[riichi]
min_points = 1000                        # 仮
requires_draw = true                     # 仮
furiten_riichi = true                    # 仮
ankan_after_riichi = "wait_unchanged"    # 仮
no_deposit_on_deal_in = true             # 仮

[dora]
ippatsu = true                           # 仮
ura = true                               # 仮
kan_dora = true                          # 仮
kan_ura = true                           # 仮
kan_dora_timing = "ankan_immediate"      # 仮

[kita]
mode = "nukidora"                        # M2（抜き北を前提とした説明）
mandatory = false                        # 仮
after_pon = false                        # 仮
after_riichi = "drawn_only"              # 仮
ron_on_kita = true                       # M2「役がある場合、抜き北に対してロンできます」
ron_on_discard = true                    # 仮
ron_counts_as_chankan = false            # M2「槍槓の役はつかない仕様」
breaks_ippatsu = true                    # 仮
breaks_first_turn = true                 # 仮
north_as_meld = "otakaze"                # 仮
dora_per_kita = 1                        # 仮

[draws]
kyushu_kyuhai = true                     # 仮
suukaikan = true                         # 仮
all_riichi = false                       # 仮
same_wind_discards = false               # 仮
all_ron = false                          # 仮
abortive_renchan = true                  # 仮
nagashi_mangan = true                    # 仮
renchan = "tenpai"                       # 仮
keishiki_tenpai = true                   # 仮
noten_declaration = false                # 仮

[yakuman]
composite = true                         # 仮
double_special = false                   # 仮
pao = ["daisangen", "daisuushii"]        # 仮
pao_ron_split = true                     # 仮
kokushi_ron_on_ankan = false             # 仮

[chips]
enabled = false                          # 仮

[chips.values]
ippatsu = 1                              # 仮
aka = 1                                  # 仮
ura = 1                                  # 仮
aka_when_open = true                     # 仮
yakuman_ron = 10                         # 仮
yakuman_tsumo_each = 5                   # 仮
kazoe_yakuman_counts = false             # 仮
point_value = 5000                       # 仮

[log_visibility]
ankan = "open"                           # 本PJ の牌譜の既定値
ryukyoku_reveal = "tenpai_only"          # 本PJ の牌譜の既定値
