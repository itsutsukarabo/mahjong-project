[table]
num_players = 3
extension_threshold = 40000      # 「1位が30000点(三人麻雀の場合は40000点)未満の場合南入(半荘戦の場合は西入)」
tobi_single_kyoku = "none"       # 本プロジェクトの決定 D-012（雀魂のルールではない）

[points]
tsumo_payment = "loss"           # 「三人麻雀段位戦ではツモ損が有効です」

[kita]
mode = "nukidora"                # 「抜き北に対してロンできます」（抜き北があることを前提とした説明）
ron = true                       # 「三人麻雀段位戦では役がある場合、抜き北に対してロンできますが、
ron_counts_as_chankan = false    #   槍槓の役はつかない仕様となっている」

[log_visibility]
# 本プロジェクトの牌譜の既定値（雀魂のルールではない。LOG_FORMAT §5）
ankan = "open"
ryukyoku_reveal = "tenpai_only"
