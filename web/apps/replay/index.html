<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牌譜再生</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; padding: 12px; font-family: "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; background: #f4f5f2; color: #1d2330; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13px; }
      .toolbar button { font-size: 13px; padding: 3px 10px; }
      .toolbar fieldset { border: 1px solid #c8d0dc; border-radius: 6px; padding: 4px 8px; display: flex; gap: 6px; align-items: center; }
      .toolbar legend { font-size: 11px; color: #6b7280; }
      #status { font-variant-numeric: tabular-nums; font-size: 13px; margin-bottom: 8px; }
      #error { color: #b00020; white-space: pre-wrap; font-size: 13px; }
      .main { display: flex; gap: 12px; align-items: flex-start; }
      #side { width: 340px; }
      #junme { width: 140px; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <fieldset>
        <legend>牌譜</legend>
        <select id="fixture" aria-label="サンプルの牌譜"></select>
        <label>牌譜ファイル <input id="logFile" type="file" accept=".jsonl,.json" /></label>
        <label>注釈 <input id="annotFile" type="file" accept=".jsonl" /></label>
      </fieldset>
      <fieldset>
        <legend>表示</legend>
        <label><input id="dev" type="checkbox" checked /> 開発者モード（全員の手牌）</label>
        <label>下の席 <select id="viewSeat"></select></label>
      </fieldset>
    </div>
    <div class="toolbar">
      <fieldset>
        <legend>移動</legend>
        <button id="prevKyoku" title="前の局">⏮ 前の局</button>
        <button id="prev" title="1手戻る（←）">◀ 戻る</button>
        <button id="next" title="1手進む（→）">進む ▶</button>
        <button id="nextKyoku" title="次の局">次の局 ⏭</button>
        <select id="kyoku" aria-label="局"></select>
        <label>巡目 <input id="junme" type="range" min="1" max="1" value="1" /> <span id="junmeLabel">1</span></label>
      </fieldset>
      <fieldset>
        <legend>自動再生</legend>
        <button id="play">▶ 再生</button>
        <select id="speed" aria-label="速さ">
          <option value="1000">1 手/秒</option>
          <option value="400" selected>2.5 手/秒</option>
          <option value="150">6.7 手/秒</option>
          <option value="40">25 手/秒</option>
        </select>
      </fieldset>
    </div>
    <div id="status"></div>
    <div id="error"></div>
    <div class="main">
      <div id="table"></div>
      <div id="side"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
